<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内网即时通讯系统 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-container {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .login-card {
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-control {
            width: 100%;
            height: 40px;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background: #fff;
        }

        .form-control:focus {
            outline: none;
            border-color: #409eff;
            box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.1);
        }

        .form-control.error {
            border-color: #f5222d;
        }

        .error-message {
            color: #f5222d;
            font-size: 12px;
            margin-top: 4px;
            min-height: 16px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            color: #606266;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 30px;
            color: #95a5a6;
            font-size: 14px;
        }

        .login-footer .version {
            margin-top: 10px;
            font-size: 12px;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .helper-links {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
        }

        .helper-link {
            color: #409eff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .helper-link:hover {
            color: #337ecc;
            text-decoration: underline;
        }

        /* 输入框图标容器 */
        .input-with-icon {
            position: relative;
        }

        .input-with-icon .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #909399;
            font-size: 16px;
        }

        .input-with-icon .form-control {
            padding-left: 40px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #909399;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>内网即时通讯系统</h1>
            <p>安全 · 高效 · 便捷</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <div class="input-with-icon">
                    <span class="icon">👤</span>
                    <input
                            type="text"
                            id="userid"
                            class="form-control"
                            placeholder="请输入用户ID"
                            autocomplete="username"
                            required
                    >
                </div>
                <div id="userid-error" class="error-message"></div>
            </div>

            <div class="form-group">
                <div class="input-with-icon">
                    <span class="icon">🔒</span>
                    <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="请输入密码"
                            autocomplete="current-password"
                            required
                    >
                    <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePasswordVisibility()"
                    >
                        显示
                    </button>
                </div>
                <div id="password-error" class="error-message"></div>
            </div>

            <div class="form-group">
                <div class="input-with-icon">
                    <span class="icon">🌐</span>
                    <input
                            type="text"
                            id="server"
                            class="form-control"
                            placeholder="服务器地址 (例如: ws://localhost:8765)"
                            value="ws://localhost:8765"
                            required
                    >
                </div>
                <div id="server-error" class="error-message"></div>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="rememberMe">
                    记住我
                </label>
            </div>

            <div class="form-group">
                <button
                        type="submit"
                        id="loginBtn"
                        class="login-btn"
                >
                    登录
                </button>
            </div>

            <div class="helper-links">
                <a href="#" class="helper-link" onclick="handleForgotPassword()">忘记密码?</a>
                <a href="#" class="helper-link" onclick="handleRegister()">注册账号</a>
            </div>

            <div class="login-footer">
                <p class="version">版本 1.0.0</p>
            </div>
        </form>
    </div>
</div>
<script src="./Login.js"></script>
<script>
    const {ipcRenderer} = require('electron');

    // 全局状态
    let isSubmitting = false;
    // DOM加载完成后初始化
    document.addEventListener('DOMContentLoaded', function () {
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', handleLogin);

        // 绑定输入验证
        document.getElementById('userid').addEventListener('blur', validateUserId);
        document.getElementById('password').addEventListener('blur', validatePassword);
        document.getElementById('server').addEventListener('blur', validateServer);

        // 加载记住我的设置
        loadRememberedSettings();
    });

    // 加载记住我的设置
    function loadRememberedSettings() {
        // 这里可以连接本地数据库或配置文件
        // 示例：从本地配置文件读取
        try {
            const config = window.electronAPI?.getConfig?.() || {};
            if (config.server) {
                document.getElementById('server').value = config.server;
            }
            if (config.rememberMe && config.userid) {
                document.getElementById('userid').value = config.userid;
                document.getElementById('rememberMe').checked = true;
            }
        } catch (e) {
            console.log('无法加载配置:', e);
        }
    }

    // 保存记住我的设置
    function saveRememberedSettings(userid, server) {
        const rememberMe = document.getElementById('rememberMe').checked;

        if (rememberMe) {
            // 这里可以保存到本地数据库或配置文件
            const config = {
                userid: userid,
                server: server,
                rememberMe: true
            };

            try {
                window.electronAPI?.saveConfig?.(config);
            } catch (e) {
                console.log('无法保存配置:', e);
            }
        } else {
            // 清除保存的设置
            try {
                window.electronAPI?.clearConfig?.();
            } catch (e) {
                console.log('无法清除配置:', e);
            }
        }
    }

    // 显示/隐藏密码
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.querySelector('.password-toggle');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.textContent = '隐藏';
        } else {
            passwordInput.type = 'password';
            toggleBtn.textContent = '显示';
        }
    }

    // 验证用户ID
    function validateUserId() {
        const useridInput = document.getElementById('userid');
        const errorEl = document.getElementById('userid-error');
        const value = useridInput.value.trim();

        if (!value) {
            showError(useridInput, errorEl, '请输入用户ID');
            return false;
        }

        if (!/^\d+$/.test(value)) {
            showError(useridInput, errorEl, '用户ID必须为数字');
            return false;
        }

        clearError(useridInput, errorEl);
        return true;
    }

    // 验证密码
    function validatePassword() {
        const passwordInput = document.getElementById('password');
        const errorEl = document.getElementById('password-error');
        const value = passwordInput.value.trim();

        if (!value) {
            showError(passwordInput, errorEl, '请输入密码');
            return false;
        }

        if (value.length < 6) {
            showError(passwordInput, errorEl, '密码长度至少6位');
            return false;
        }

        clearError(passwordInput, errorEl);
        return true;
    }

    // 验证服务器地址
    function validateServer() {
        const serverInput = document.getElementById('server');
        const errorEl = document.getElementById('server-error');
        const value = serverInput.value.trim();

        if (!value) {
            showError(serverInput, errorEl, '请输入服务器地址');
            return false;
        }

        if (!value.startsWith('ws://') && !value.startsWith('wss://')) {
            showError(serverInput, errorEl, '服务器地址必须以 ws:// 或 wss:// 开头');
            return false;
        }

        clearError(serverInput, errorEl);
        return true;
    }

    // 显示错误
    function showError(inputElement, errorElement, message) {
        inputElement.classList.add('error');
        errorElement.textContent = message;
    }

    // 清除错误
    function clearError(inputElement, errorElement) {
        inputElement.classList.remove('error');
        errorElement.textContent = '';
    }

    // 表单验证
    function validateForm() {
        const isUserIdValid = validateUserId();
        const isPasswordValid = validatePassword();
        const isServerValid = validateServer();

        return isUserIdValid && isPasswordValid && isServerValid;
    }

    // 登录处理
    async function handleLogin(event) {
        event.preventDefault();

        if (isSubmitting) return;

        // 验证表单
        if (!validateForm()) {
            return;
        }

        // 获取表单数据
        const userid = document.getElementById('userid').value.trim();
        const password = document.getElementById('password').value.trim();
        const server = document.getElementById('server').value.trim();

        // 设置提交状态
        isSubmitting = true;
        setLoading(true);

        try {
            // 保存记住我设置
            saveRememberedSettings(userid, server);

            // 这里可以调用Electron API进行登录
            // 示例：window.electronAPI.login({ userid, password, server });

            // 模拟登录过程
            console.log('登录信息:', {userid, password, server});
            // window.IMClient.login(Number(userid), password)
            // ;
            ipcRenderer.send('login', Number(userid), password, document.getElementById('rememberMe').checked
            )
            ipcRenderer.on("login:error", (event, data) => {
                showMessage(data.message, "error")
            })
            ipcRenderer.on("login:success", (event, data) => {
                showMessage('登录成功', 'success');
            })

            // 模拟网络请求延迟
            // await new Promise(resolve => setTimeout(resolve, 1500));

            // 登录成功 - 这里应该由外部回调处理
            // 例如：window.electronAPI.onLoginSuccess()
            // console.log('登录成功，即将关闭登录窗口');

            // 显示成功消息
            // showMessage('登录成功', 'success');

            // 延迟后关闭窗口或跳转
            // setTimeout(() => {
            //     // 这里应该由主进程关闭窗口或跳转到主界面
            //     if (window.electronAPI && window.electronAPI.closeLoginWindow) {
            //         window.electronAPI.closeLoginWindow();
            //     } else {
            //         // 如果没有Electron API，简单重定向
            //         console.log('跳转到主界面');
            //         // window.location.href = 'main.html';
            //     }
            // }, 1000);

        } catch (error) {
            console.error('登录失败:', error);
            showMessage(`登录失败: ${error.message}`, 'error');
            setLoading(false);
            isSubmitting = false;
        }
    }

    // 设置加载状态
    function setLoading(isLoading) {
        const loginBtn = document.getElementById('loginBtn');

        if (isLoading) {
            loginBtn.innerHTML = '<span class="loading-spinner"></span>登录中...';
            loginBtn.disabled = true;
        } else {
            loginBtn.innerHTML = '登录';
            loginBtn.disabled = false;
        }
    }

    // 显示消息
    function showMessage(message, type = 'info') {
        // 创建消息元素
        const messageEl = document.createElement('div');
        messageEl.textContent = message;
        messageEl.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 24px;
                border-radius: 8px;
                color: white;
                font-size: 14px;
                z-index: 10000;
                animation: fadeIn 0.3s;
                max-width: 300px;
                word-break: break-word;
            `;

        // 设置消息类型样式
        const typeStyles = {
            success: {background: '#52c41a'},
            error: {background: '#f5222d'},
            warning: {background: '#faad14'},
            info: {background: '#1890ff'}
        };

        Object.assign(messageEl.style, typeStyles[type] || typeStyles.info);

        // 添加到页面
        document.body.appendChild(messageEl);

        // 3秒后自动移除
        setTimeout(() => {
            messageEl.style.opacity = '0';
            messageEl.style.transition = 'opacity 0.3s';
            setTimeout(() => {
                if (messageEl.parentNode) {
                    messageEl.parentNode.removeChild(messageEl);
                }
            }, 300);
        }, 3000);

        // 添加淡入动画
        const style = document.createElement('style');
        style.textContent = `
                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(-20px); }
                    to { opacity: 1; transform: translateY(0); }
                }
            `;
        document.head.appendChild(style);
    }

    // 处理忘记密码
    function handleForgotPassword(event) {
        if (event) event.preventDefault();
        showMessage('请联系系统管理员重置密码', 'info');
    }

    // 处理注册
    function handleRegister(event) {
        if (event) event.preventDefault();
        showMessage('请联系系统管理员注册账号', 'info');
    }

    // 简单的表单输入提示
    document.querySelectorAll('.form-control').forEach(input => {
        input.addEventListener('focus', function () {
            this.parentElement.style.transform = 'scale(1.02)';
        });

        input.addEventListener('blur', function () {
            this.parentElement.style.transform = 'scale(1)';
        });
    });
</script>
</body>
</html>
